name: AIPlatform quality gates
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-enterprise.txt
      - run: python -m pytest -q tests evals
      - run: python -m compileall -q app.py catalog.py llm.py runtime.py enterprise evals
      - name: Build deployable image
        run: docker build -t aiplatform:ci .
